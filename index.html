<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页预览器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #2d2d2d; padding: 20px; border-bottom: 1px solid #444; }
    .logo { font-size: 24px; font-weight: bold; color: #00d4ff; margin-bottom: 20px; }
    .address-bar { display: flex; gap: 10px; align-items: center; }
    .address-bar input { flex: 1; background: #1a1a1a; border: 1px solid #444; border-radius: 6px; padding: 12px 16px; color: #fff; font-size: 16px; outline: none; }
    .address-bar button { background: #00d4ff; border: none; color: #000; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
    .address-bar button:hover { background: #00b8e6; }
    .content { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 250px; background: #2d2d2d; border-right: 1px solid #444; padding: 20px; overflow-y: auto; }
    .sidebar h2 { color: #00d4ff; margin-bottom: 15px; font-size: 18px; }
    .status { background: #3d3d3d; border-radius: 6px; padding: 15px; margin: 10px 0; }
    .status.loading { border-left: 4px solid #00d4ff; }
    .status.error { border-left: 4px solid #ff6b6b; color: #ff6b6b; }
    .status.success { border-left: 4px solid #4ecdc4; color: #4ecdc4; }
    .history { margin-top: 20px; }
    .history-item { background: #3d3d3d; border-radius: 6px; padding: 10px 15px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .history-item:hover { background: #4d4d4d; }
    .history-item .url { font-size: 14px; word-break: break-all; flex: 1; }
    .history-item .date { font-size: 12px; color: #888; margin-left: 10px; }
    .preview { flex: 1; display: flex; flex-direction: column; }
    .preview-header { background: #2d2d2d; padding: 10px 20px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
    .preview-title { font-size: 14px; color: #888; }
    .preview-actions { display: flex; gap: 10px; }
    .preview-actions button { background: #3d3d3d; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .preview-actions button:hover { background: #4d4d4d; }
    .preview-content { flex: 1; padding: 0; overflow: hidden; }
    .preview-content iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .footer { background: #2d2d2d; padding: 15px 20px; border-top: 1px solid #444; text-align: center; font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌐 网页预览器</div>
    <div class="address-bar">
      <input type="text" id="urlInput" placeholder="输入网址，例如 https://x.com" value="https://x.com">
      <button onclick="previewPage()">预览网页</button>
    </div>
  </div>
  <div class="content">
    <div class="sidebar">
      <h2>操作状态</h2>
      <div id="status" class="status"></div>
      <h2>预览历史</h2>
      <div id="history" class="history"></div>
    </div>
    <div class="preview">
      <div class="preview-header">
        <div class="preview-title" id="previewTitle">请输入网址并点击预览</div>
        <div class="preview-actions">
          <button onclick="downloadMHT()">下载MHT</button>
          <button onclick="refreshPreview()">刷新</button>
        </div>
      </div>
      <div class="preview-content">
        <iframe id="previewFrame" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
      </div>
    </div>
  </div>
  <div class="footer">
    网页预览器 v1.0 | 实时预览网页内容
  </div>
  <script>
    let previewHistory = JSON.parse(localStorage.getItem('preview_history') || '[]');
    let currentUrl = '';
    let currentHtml = '';

    function updateHistory() {
      const container = document.getElementById('history');
      if (previewHistory.length === 0) {
        container.innerHTML = '<div class="status">暂无预览历史</div>';
        return;
      }
      container.innerHTML = previewHistory.map(item => 
        '<div class="history-item" onclick="loadFromHistory(\'' + item.url + '\')">' +
        '<div class="url">' + item.url + '</div>' +
        '<div class="date">' + new Date(item.timestamp).toLocaleString() + '</div>' +
        '</div>'
      ).join('');
    }

    function loadFromHistory(url) {
      document.getElementById('urlInput').value = url;
      previewPage();
    }

    function showStatus(message, type = 'info') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + type;
    }

    function generateMHT(html, baseUrl) {
      const boundary = "----MHTBoundary" + Date.now();
      const now = new Date().toUTCString();
      
      let mht = "From: <Saved by MHT Downloader>\r\n";
      mht += "Subject: " + new URL(baseUrl).hostname + "\r\n";
      mht += "Date: " + now + "\r\n";
      mht += "MIME-Version: 1.0\r\n";
      mht += "Content-Type: multipart/related;\r\n";
      mht += ' boundary="' + boundary + '"\r\n';
      mht += "X-Generated-By: MHT Downloader\r\n";
      mht += "\r\n";
      mht += "--" + boundary + "\r\n";
      mht += "Content-Type: text/html; charset=utf-8\r\n";
      mht += "Content-Transfer-Encoding: quoted-printable\r\n";
      mht += "Content-Location: " + baseUrl + "\r\n";
      mht += "\r\n";
      mht += html;
      mht += "\r\n";
      mht += "--" + boundary + "--\r\n";
      
      return mht;
    }

    async function previewPage() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) {
        showStatus('请输入网址', 'error');
        return;
      }

      showStatus('正在获取网页内容...', 'loading');
      document.getElementById('previewTitle').textContent = '加载中...';

      try {
        const fullUrl = url.startsWith('http') ? url : 'https://' + url;
        currentUrl = fullUrl;
        showStatus('正在处理: ' + fullUrl, 'loading');
        
        // 使用第三方CORS代理
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(fullUrl);
        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error('获取失败: ' + response.status + ' ' + errorText);
        }

        currentHtml = await response.text();
        
        // 在iframe中显示内容
        const iframe = document.getElementById('previewFrame');
        const blob = new Blob([currentHtml], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        iframe.onload = () => URL.revokeObjectURL(blobUrl);
        iframe.src = blobUrl;
        
        document.getElementById('previewTitle').textContent = fullUrl;
        
        // 添加到历史记录
        if (!previewHistory.some(item => item.url === fullUrl)) {
          previewHistory.unshift({
            url: fullUrl,
            timestamp: Date.now()
          });
          if (previewHistory.length > 20) previewHistory.pop();
          localStorage.setItem('preview_history', JSON.stringify(previewHistory));
          updateHistory();
        }
        
        showStatus('网页预览成功', 'success');
      } catch (err) {
        showStatus('错误: ' + err.message, 'error');
        document.getElementById('previewTitle').textContent = '预览失败';
      }
    }

    function downloadMHT() {
      if (!currentUrl || !currentHtml) {
        showStatus('请先预览网页', 'error');
        return;
      }

      try {
        const mht = generateMHT(currentHtml, currentUrl);
        const blob = new Blob([mht], { type: 'message/rfc822' });
        const filename = new URL(currentUrl).hostname + '_' + Date.now() + '.mht';
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showStatus('MHT文件已开始下载', 'success');
      } catch (err) {
        showStatus('下载失败: ' + err.message, 'error');
      }
    }

    function refreshPreview() {
      previewPage();
    }

    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') previewPage();
    });

    updateHistory();
  </script>
</body>
</html>
